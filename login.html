<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Gaming App</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ==================== -->
    <!-- FAVICONS -->
    <!-- Standard favicon -->
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico?v=2" />

    <!-- PNG favicons for modern browsers -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png?v=2"
    />

    <!-- Apple touch icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />

    <!-- Web manifest -->
    <link rel="manifest" href="/public/site.webmanifest?v=2" />

    <!-- ==================== -->
    <!-- BOOTSTRAP CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS for Login -->
    <link rel="stylesheet" href="styles/Login.css" />

    <!--  login.js-->
    <script src="js/Login.js"></script>

    <!-- ==================== -->
    <!-- BOOTSTRAP JS BUNDLE -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body class="bg-light">
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="card p-4 shadow login-card">
        <h2 class="text-center mb-4">Game Lobby Login</h2>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="Enter username"
              required
            />
          </div>

          <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select class="form-select" id="role" required>
              <option value="" disabled selected>Select your role</option>
              <option value="creator">Creator</option>
              <option value="host">Host</option>
              <option value="player">Player</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter password"
              required
            />
          </div>

          <!-- Log in screen music choice -->
          <div class="mb-3">
            <label for="musicSelect" class="form-label"
              >Choose Background Music</label
            >
            <select id="musicSelect" class="form-select">
              <option value="music/assets/runDMCWalkThisWay.mp3">Run DMC & Areosmith Walk this Way</option>
              <option value="music/assets/gunsNRosesWelcomeToTheJungle.mp3">Guns-N-Roses Welcome to the Jungle</option>
              <option value="music/assets/metallicaEnterSandman.mp3">Metallica Enter Sandman</option>
              <option value="music/assets/skidRow18AndLife.mp3">Skid Row 18 and Life</option>
              <option value="music/assets/skilletFeelInvincible.mp3">Skillet Feel Invincible</option>
            </select>
          </div>

          <!-- Hidden audio player -->
          <audio id="loginMusic" autoplay loop></audio>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>

        <div id="loginError" class="text-danger mt-3 text-center">
          Invalid username, role, or password.
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS for Login -->
    <script src="js/Login.js"></script>
  </body>
</html>
