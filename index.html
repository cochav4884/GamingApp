<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaming App</title>

    <!-- ==================== -->
    <!-- FAVICONS -->
    <!-- Standard favicon -->
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico?v=2" />

    <!-- PNG favicons for modern browsers -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png?v=2"
    />

    <!-- Apple touch icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />

    <!-- Web manifest -->
    <link rel="manifest" href="/public/site.webmanifest?v=2" />

    <!-- ==================== -->
    <!-- BOOTSTRAP CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/dice.css" />

    <!-- ==================== -->
    <!-- BOOTSTRAP JS BUNDLE -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>

  <body>
    <!-- Left Sidebar (Lobby) -->
    <div id="LobbySidebar" class="sidebar-left Lobby">
      <a href="javascript:void(0)" class="closebtn">&times;</a>

      <!-- NEW Welcome Header -->
      <h2 class="welcome-header text-center">Welcome to the Horizon Lobby</h2>

      <!-- Color Changing Button -->
      <button id="changeLobbyBgBtn" type="button" class="btn btn-secondary mb-3">Change Background</button>

      <div id="loggedInList" class="logged-in-list">
        <h3>Users in Lobby:</h3>
        <ul id="userList"></ul>
        <button
          type="button"
          id="refreshUsersBtn"
          class="btn btn-sm btn-secondary mt-2"
        >
          Refresh Users
        </button>
      </div>

      <div id="diceBox" class="lobby-section">
  <h4>Dice Box</h4>
  <div id="diceOptions" class="dice-options">
    <!-- Dice thumbnails will go here -->
  </div>

  <button id="rollBtn" type="" class="btn btn-primary mt-2">Roll</button>

  <!-- Dice result box -->
  <div id="diceResultBox" class="dice-result-box mt-2">
    <span id="diceResultLabel">Result:</span>
    <span id="diceValue" class="dice-value">-</span>
  </div>
</div>

        <button type="button" id="logoutBtn" class="btn btn-secondary mt-2">Logout</button>
      </div>
    </div>
    <div id="LobbyTab" class="sidebar-tab left-tab">Lobby</div>

    <!-- Background tab on left -->
    <div id="BackgroundTab" class="sidebar-tab left-tab">Background</div>
    <div id="BackgroundSidebar" class="sidebar-left Background">
      <a href="#" class="closebtn">&times;</a>
      <div class="lobby-title">Background</div>
      <section>
        Choose Asset
        <ul id="backgroundList"></ul>
      </section>
    </div>

     <!-- Host tab on left -->
<div id="HostTab" class="sidebar-tab left-tab">Host</div>

<!-- Host Sidebar -->
<div id="HostSidebar" class="sidebar-left Host">
  <a href="javascript:void(0)" class="closebtn">&times;</a>

  <h2 class="text-center">Host Controls</h2>

  <section>
    <!-- Optional Host Tools description -->
    <p>Host Tools</p>

    <div id="hostControls" class="mt-3 d-flex flex-column gap-2">
      <!-- Inside Host Sidebar -->
      <button id="openBattlefieldBtn" type="button" class="btn btn-secondary">Open Battlefield</button>
      <button id="startGameHostBtn" type="button" class="btn btn-success">Start Game</button>
      <button id="endGameHostBtn" type="button" class="btn btn-danger" disabled>End Game</button>
      <!-- Full reset (background + assets) -->
      <button id="resetBattlefieldBtn" type="button" class="btn btn-warning">Reset Battlefield</button>
      <!-- Soft reset (assets only, keep background) -->
      <button id="softResetBattlefieldBtn" type="button" class="btn btn-info">Clear Assets</button>
      
<!-- Add more host-specific buttons here -->
    </div>

       <!-- Assets container -->
    <ul id="hostAssetList"></ul>
  </section>
</div>


    <!-- Right Sidebars & Tabs -->
    <div id="rightSidebarsContainer" class="right-sidebars">
      <div id="sidebarTabContainer" class="sidebar-tab-container"></div>
    </div>
    <div id="rightPanels"></div>

    <!-- Main Content / Battlefield -->
    <div id="main">
      <h1>Battlefield</h1>
      <div id="battlefield">
        <div id="gridOverlay" class="grid-overlay"></div>
        <button id="fullscreenBtn" type="button" class="btn btn-secondary">
          FullScreen
        </button>
        <button
          id="exitFullscreenBtn"
          type="button"
          class="btn btn-danger hidden"
        >
          Exit FullScreen
        </button>
      </div>
      <p>Main content area. Open any sidebar using the tabs.</p>
    </div>

    <!-- Main JS -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
